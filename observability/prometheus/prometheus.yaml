# ════════════════════════════════════════════════════════════════════════════
# Prometheus — configuración de scraping del laboratorio
#
# Dos caminos de métricas conviven a propósito:
#   1. vía Collector (:8889) → camino de producción, centralizado
#   2. scraping directo a las apps (:9464) → control, permite validar que el
#      Collector no pierde ni altera métricas
# ════════════════════════════════════════════════════════════════════════════

global:
  scrape_interval:     10s
  evaluation_interval: 15s
  external_labels:
    cluster:     otel-lab
    environment: development

scrape_configs:
  # ── Métricas de las apps reexportadas por el Collector ────────────────────
  - job_name: otel-collector-apps
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          source: collector

  # ── Métricas internas del Collector (spans recibidos/rechazados/en cola) ──
  # Alimentan el panel de errores del Collector del dashboard.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          source: collector-internal

  # ── Scraping directo a los servicios (PrometheusMetricReader del SDK) ─────
  - job_name: service-a-direct
    static_configs:
      - targets: ["service-a:9464"]
        labels:
          service: service-a
          source:  direct
    metric_relabel_configs:
      # Las métricas del recolector de basura de Python inflan la cardinalidad
      # sin aportar a los SLIs.
      - source_labels: [__name__]
        regex: "python_gc.*"
        action: drop

  - job_name: service-b-direct
    static_configs:
      - targets: ["service-b:9464"]
        labels:
          service: service-b
          source:  direct
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "python_gc.*"
        action: drop

  # ── Métricas del propio Prometheus ────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
