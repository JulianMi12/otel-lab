# ════════════════════════════════════════════════════════════════════════════
# PostgreSQL dentro del cluster
#
# Se usa un StatefulSet con un PVC de 5 GiB en lugar de Cloud SQL porque el
# objetivo del modulo es el service mesh, no la base: mantener la base dentro
# de la malla permite ver tambien el trafico service-a -> postgres en Kiali y
# evita el costo fijo de una instancia gestionada.
# ════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: otel-lab
  labels: { app: postgres }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: otel-lab
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS orders (
        id          SERIAL PRIMARY KEY,
        order_id    TEXT        NOT NULL UNIQUE,
        product     TEXT        NOT NULL,
        quantity    INTEGER     NOT NULL,
        unit_price  NUMERIC(10, 2) NOT NULL DEFAULT 0,
        status      TEXT        NOT NULL DEFAULT 'created',
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_orders_product ON orders (product);
    CREATE INDEX IF NOT EXISTS idx_orders_status  ON orders (status);
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: otel-lab
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        # Postgres habla un protocolo binario que Envoy no inspecciona a L7.
        # Excluirlo del sidecar evita el sobrecosto de un proxy que no aporta
        # nada en esta ruta y elimina una fuente conocida de fallos al
        # arrancar (el sidecar tarda mas que el initContainer de la base).
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: tcp-postgres
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: db-credenciales, key: usuario } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credenciales, key: password } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: db-credenciales, key: base } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "app", "-d", "appdb"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: datos }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
