# ════════════════════════════════════════════════════════════════════════════
# Los tres microservicios dentro de la malla
#
# Observese lo que NO aparece en estos manifiestos: ninguna configuracion de
# reintentos, ni de timeouts, ni de mTLS, ni de circuit breaker. Todo eso vive
# en los manifiestos de Istio (40-, 41-, 42-). Esa separacion es el argumento
# del Modulo A: la misma imagen que corre en Cloud Run y en ECS Fargate gana
# politicas de resiliencia L7 solo por estar en la malla.
#
# Convencion de puertos: Istio deduce el protocolo del nombre del puerto. Un
# puerto llamado "http" se inspecciona a L7 (rutas, codigos, reintentos); uno
# sin nombre se trata como TCP opaco y la mitad de la telemetria se pierde.
# ════════════════════════════════════════════════════════════════════════════

# ── service-a ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-a
  namespace: otel-lab
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  namespace: otel-lab
  labels: { app: service-a, service: service-a }
spec:
  selector: { app: service-a }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: http-prom
      port: 9464
      targetPort: 9464
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: otel-lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: service-a }
  template:
    metadata:
      labels:
        app: service-a
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      serviceAccountName: service-a
      containers:
        - name: app
          image: IMAGEN_SERVICE_A
          ports:
            - { containerPort: 8000, name: http }
            - { containerPort: 9464, name: http-prom }
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: OTEL_SERVICE_NAME
              value: service-a
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: db-credenciales, key: url } }
            - name: DATASTORE
              value: postgres
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # Lo consume el SDK y acaba como k8s.pod.ip en el recurso, que es
            # la clave con la que el procesador k8sattributes asocia la señal
            # a su Pod.
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.ip=$(POD_IP),k8s.pod.name=$(POD_NAME)
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 150m, memory: 192Mi }
            limits:   { cpu: 600m, memory: 512Mi }
---
